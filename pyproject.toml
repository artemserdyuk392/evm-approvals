[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evm-approvals"
version = "0.1.0"
description = "Read-only audit of ERC-20 and ERC-721 approvals for an EVM address"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Artem Serdyuk" }]
keywords = ["ethereum", "erc20", "erc721", "approvals", "allowance", "security"]
dependencies = [
    "web3>=6.11",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/artemserdyuk392/evm-approvals"

[project.scripts]
evm-approvals = "evm_approvals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
